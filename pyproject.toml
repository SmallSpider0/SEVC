[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sevc"
version = "0.1.0"
description = "SEVC research prototype and main experiment source snapshot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.4", "torchvision>=0.19", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]
plots = ["matplotlib>=3.7"]

[project.scripts]
sevc = "sevc.experiments.source_distribution:main"

[tool.setuptools.packages.find]
include = ["sevc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
